# Riddlen Protocol Documentation Site Configuration
# This site will be served at riddlen.org

# Site settings
title: "Riddlen Docs"
description: "How Riddlen works: a scavenger hunt for the whole world. Buy a riddle as an NFT, solve it, go to the place, scan what you find, share the pot with everyone who finds it after you. Whitepaper, tokenomics, contracts, and the road to mainnet."
baseurl: ""
url: "https://riddlen.org"
lang: "en"
author: "Riddlen"

# SEO & Meta tags
tagline: "A scavenger hunt for the whole world"
keywords: "riddlen, riddles, scavenger hunt, treasure hunt, RDLN, polygon, NFT, web3 game, geocaching"
image: "/assets/images/riddlen-og-image.png"
logo: "/assets/images/riddlen-logo.png"

# Repository information
repository: "RiddlenBaba/riddlen"
github_username: "RiddlenBaba"

# Social links
social:
  twitter: "RiddlenToken"
  telegram: "RiddlenToken"
  telegram_community: "RiddlenCommunity"
  website: "https://riddlen.com"

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-mentions
  - jekyll-optional-front-matter

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Navigation
header_pages:
  - index.md

# Collections
collections:
  guides:
    output: true
    permalink: /:collection/:name/
  contracts:
    output: true
    permalink: /:collection/:name/

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .git/
  - .gitignore

# Include files
include:
  - _pages

# SEO settings
twitter:
  username: RiddlenToken

facebook:
  app_id:
  publisher:
  admins:

# Google Analytics (if you want to add later)
# google_analytics:

# Defaults for different content types
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      author: "Riddlen"

# Custom variables
riddlen:
  version: "v6.0"
  network: "Polygon Amoy Testnet"
  chain_id: 80002
  contracts:
    rdln: "0x133029184EC460F661d05b0dC57BFC916b4AB0eB"
    ron: "0xD86b146Ed091b59cE050B9d40f8e2760f14Ab635"
    hunt: "0xa5a36d589B122d0306FEEa7422e3c7f7d8edf009"
    hunt_nft: "0x992eDCea80fb82dEa0B05bD749938f6c3A0fA782"
    hunt_commitments: "0x3af3f98189c8622Db6E03105932652C78bAeD1D1"